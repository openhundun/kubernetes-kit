apiVersion: apps/v1
kind: Deployment
metadata:
  name: fork-mesh
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fork-mesh
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fork-mesh
    spec:
      serviceAccountName: fork-mesh
      containers:
        - name: fork-mesh
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
